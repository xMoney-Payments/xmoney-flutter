name: xmoney_ios
description: iOS implementation of the federated xMoney Flutter payments SDK.
version: 0.0.1
homepage: https://xmoney.com
repository: https://github.com/xMoney-Payments/xmoney-flutter
issue_tracker: https://github.com/xMoney-Payments/xmoney-flutter/issues
topics:
  - payments
  - checkout

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xmoney_platform_interface: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: xmoney
    platforms:
      ios:
        pluginClass: XMoneyPlugin
        dartPluginClass: XMoneyIosPlugin
