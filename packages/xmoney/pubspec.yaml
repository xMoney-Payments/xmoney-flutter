name: xmoney
description: Flutter SDK for xMoney checkout — Payment Sheet, Payment Element, Apple Pay, and Google Pay.
version: 0.0.1
homepage: https://xmoney.com
repository: https://github.com/xMoney-Payments/xmoney-flutter
issue_tracker: https://github.com/xMoney-Payments/xmoney-flutter/issues
topics:
  - payments
  - checkout
  - apple-pay
  - google-pay

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xmoney_platform_interface: ^0.0.1
  xmoney_android: ^0.0.1
  xmoney_ios: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: xmoney_android
      ios:
        default_package: xmoney_ios
